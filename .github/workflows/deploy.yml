name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: |
          echo "API URL: $VITE_API_BASE_URL"
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYMENT_URL: ${{ secrets.VITE_PAYMENT_URL }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure dist directory exists on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "mkdir -p /home/ubuntu/frontend/dist"

      - name: Fix permissions on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} \
          "sudo chown -R ubuntu:ubuntu /home/ubuntu/frontend/dist && sudo chmod -R 755 /home/ubuntu/frontend/dist"

      - name: Copy build to EC2
        run: |
          scp -i ~/.ssh/id_rsa -r dist/* \
          ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/frontend/dist/

      - name: Fix Nginx permissions after deploy
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} \
          "sudo chown -R www-data:www-data /home/ubuntu/frontend/dist && sudo chmod -R 755 /home/ubuntu/frontend/dist"

      - name: Restart Nginx
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} \
          "sudo systemctl restart nginx"

      - name: Done
        run: echo "✅ Frontend deployed successfully!"
